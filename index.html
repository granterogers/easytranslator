<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Translate History</title>
<meta name="description" content="Fast, private translation with automatic local history. No accounts, no backend, works offline for your saved history.">

<meta name="theme-color" content="#0f172a">
<meta name="color-scheme" content="dark light">
<script>
  try {
    var t = localStorage.getItem('lt_theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>

<!-- iOS PWA / Safari home screen support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Translate">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">

<!-- Warm up DNS + TLS to the default translation provider while the page
     is still loading, so the first translation of a session doesn't pay
     for connection setup on top of the request itself. Costs nothing if
     the provider ends up unused (a different one is remembered, or
     everything is served from the local index). -->
<link rel="preconnect" href="https://translate.googleapis.com" crossorigin>
</head>
<body>

<div class="app">

  <main class="views">

    <!-- TRANSLATE VIEW -->
    <section id="view-translate" class="view" data-view="translate">

      <button id="langToggleBtn" class="lang-toggle-btn" type="button" aria-expanded="true" aria-controls="langRow" aria-label="Hide language selectors">
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
      </button>

      <div class="lang-row" id="langRow">
        <select id="sourceLang" class="lang-select" aria-label="Source language"></select>
        <button id="swapBtn" class="icon-btn swap-btn" type="button" aria-label="Swap languages">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3 1.4-1.4L21.8 8l-5.4 5.4L15 12l3-3H7V7zm10 10H6l3 3-1.4 1.4L2.2 16l5.4-5.4L9 12l-3 3h11v2z"/></svg>
        </button>
        <select id="targetLang" class="lang-select" aria-label="Target language"></select>
      </div>

      <div class="field-block">
        <div class="source-text-wrap">
          <!-- The real textarea is where dictation/typing lands, and its
               value is NEVER rewritten while the mic may be live (that's
               what kept breaking iOS dictation). Its own text is rendered
               transparent; #sourceOverlay draws just the current phrase on
               top, so the box LOOKS cleared for each new phrase while the
               field underneath is left alone. See js/main.js. -->
          <textarea id="sourceText" class="source-text" placeholder="Type or paste text to translate…" aria-label="Text to translate" autocapitalize="sentences" spellcheck="false" autofocus></textarea>
          <div id="sourceOverlay" class="source-overlay" aria-hidden="true"></div>
          <button id="clearInputBtn" class="clear-btn" type="button" aria-label="Clear text" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.3 13.3-1.4 1.4L12 13.9l-2.9 2.9-1.4-1.4L10.6 12.5 7.7 9.6l1.4-1.4L12 11.1l2.9-2.9 1.4 1.4L13.4 12.5l2.9 2.8z"/></svg>
          </button>
        </div>
        <div class="field-meta">
          <span id="phraseLed" class="phrase-led is-ready" aria-hidden="true"></span>
          <span id="statusLabel" class="status-label" hidden>
            <span class="mini-spinner" aria-hidden="true"></span>
            <span>Translating…</span>
          </span>
          <span id="detectedLabel" class="detected-label" hidden></span>
        </div>
      </div>

      <div id="errorBanner" class="error-banner" role="alert" hidden></div>

      <div class="field-block result-block" id="resultBlock" hidden>
        <div class="result-text-wrap">
          <div class="result-text" id="resultText" tabindex="0" aria-live="polite"></div>
          <button id="copyResultBtn" class="copy-btn" type="button" aria-label="Copy translation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
          </button>
        </div>
        <p id="resultRomanized" class="result-romanized" hidden></p>
        <p id="translationNote" class="translation-note" hidden></p>
      </div>

    </section>

    <!-- HISTORY VIEW -->
    <section id="view-history" class="view" data-view="history" hidden>

      <div class="history-toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="search-icon"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19l-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
          <input id="searchInput" type="search" placeholder="Search history…" aria-label="Search history" enterkeyhint="search">
        </div>
        <button id="clearAllBtn" class="text-btn danger" type="button">Clear all</button>
      </div>

      <ul id="historyList" class="history-list"></ul>

      <p id="historyEmpty" class="empty-state" hidden>No translations yet.<br>Your history will appear here.</p>
      <p id="historyNoResults" class="empty-state" hidden>No matches found.</p>

    </section>

    <!-- SETTINGS VIEW -->
    <section id="view-settings" class="view" data-view="settings" hidden>

      <h2 class="settings-heading">Settings</h2>

      <div class="settings-section">
        <label class="settings-label">Appearance</label>
        <div class="theme-toggle">
          <button id="themeDarkBtn" class="theme-btn" type="button">Dark</button>
          <button id="themeLightBtn" class="theme-btn" type="button">Light</button>
        </div>
      </div>

      <div class="settings-section">
        <label for="phraseGapInput" class="settings-label">
          Dictation: start a new phrase after a pause of
          <span id="phraseGapValue">4.0s</span>
        </label>
        <input type="range" id="phraseGapInput" min="0" max="8" step="0.5" value="4">
      </div>

      <p class="version-tag" id="versionTag"></p>

    </section>

  </main>

  <nav class="tabbar" role="tablist" aria-label="Sections">
    <button class="tab-btn active" data-target="translate" role="tab" aria-selected="true" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.5 17.5 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
      <span>Translate</span>
    </button>
    <button class="tab-btn" data-target="history" role="tab" aria-selected="false" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 2.05 4.95l-1.42 1.42A9 9 0 1 0 13 3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      <span>History</span>
    </button>
    <button class="tab-btn" data-target="settings" role="tab" aria-selected="false" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.65l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.43h-3.84a.5.5 0 0 0-.5.43l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.66 8.87a.5.5 0 0 0 .12.65l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.5.5 0 0 0-.12.65l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54a.5.5 0 0 0 .5.43h3.84a.5.5 0 0 0 .5-.43l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.65l-2.03-1.58zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
      <span>Settings</span>
    </button>
  </nav>

</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
