<!--
  Source for icons/icon-192.png and icons/icon-512.png. The glyph is the
  same Material "translate" path used for the in-app Translate tab icon
  (index.html), so the home-screen icon and the in-app icon match.

  To regenerate after editing this file (needs Node + Playwright):
    const { chromium } = require('playwright');
    (async () => {
      const browser = await chromium.launch();
      const page = await browser.newPage({ viewport: { width: 512, height: 512 } });
      await page.goto('file://' + require('path').resolve('scripts/icon-source.html'));
      await (await page.$('#icon')).screenshot({ path: 'icons/icon-512.png' });
      await page.setViewportSize({ width: 192, height: 192 });
      await page.evaluate(() => {
        document.querySelector('.icon').style.width = '192px';
        document.querySelector('.icon').style.height = '192px';
        document.querySelector('.icon svg').style.width = '120px';
        document.querySelector('.icon svg').style.height = '120px';
      });
      await (await page.$('#icon')).screenshot({ path: 'icons/icon-192.png' });
      await browser.close();
    })();
